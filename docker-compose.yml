version: "3.9"

services:
  api:
    build: .
    ports:
      - '8000:8000'
    env_file:
      - .env  # FIX: Indented and formatted as a list element
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app  # hot-reload in dev; remove in production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enrollment_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
      - db
    command: celery -A app.celery_app.celery_app worker --loglevel=info

  celery_beat:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
    command: celery -A app.celery_app.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data: